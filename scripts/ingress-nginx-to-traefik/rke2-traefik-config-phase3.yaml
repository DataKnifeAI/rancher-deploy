apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-traefik
  namespace: kube-system
  labels:
    purpose: ingress-nginx-migration
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true
      # Ingress cutover complete — NGINX-compat provider off.
      kubernetesIngressNGINX:
        enabled: false
    gatewayClass:
      enabled: true
      name: traefik
    gateway:
      enabled: true
      name: traefik-gateway
      listeners:
        web:
          port: 8000
          protocol: HTTP
          namespacePolicy:
            from: All
        websecure:
          port: 8443
          protocol: HTTPS
          namespacePolicy:
            from: All
          mode: Terminate
          certificateRefs:
            - name: wildcard-dataknife-net-tls
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    service:
      enabled: true
    tlsStore:
      default:
        defaultCertificate:
          secretName: wildcard-dataknife-net-tls
