---
# Test PVC with official TrueNAS CSI driver (truenas-csi-nfs)
# Usage: kubectl apply -f tests/test-truenas-csi-pvc.yaml
#        kubectl delete -f tests/test-truenas-csi-pvc.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: csi-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: truenas-csi-test-pvc
  namespace: csi-test
spec:
  storageClassName: truenas-csi-nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: truenas-csi-test-pod
  namespace: csi-test
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: truenas-csi-test-pvc
  restartPolicy: Never
