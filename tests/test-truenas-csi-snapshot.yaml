---
# Snapshot test: create snapshot, restore to new PVC
apiVersion: v1
kind: Namespace
metadata:
  name: csi-test
---
# Source PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: truenas-csi-snapshot-source
  namespace: csi-test
spec:
  storageClassName: truenas-csi-nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
# Pod to write data before snapshot
apiVersion: v1
kind: Pod
metadata:
  name: csi-test-snapshot-writer
  namespace: csi-test
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c", "echo 'snapshot-test-data' > /data/important.txt && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: truenas-csi-snapshot-source
  restartPolicy: Never
---
# VolumeSnapshotClass (CSI driver creates these)
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: truenas-csi-snapshot-class
driver: csi.truenas.io
deletionPolicy: Delete
---
# VolumeSnapshot
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: truenas-csi-test-snapshot
  namespace: csi-test
spec:
  volumeSnapshotClassName: truenas-csi-snapshot-class
  source:
    persistentVolumeClaimName: truenas-csi-snapshot-source
---
# Restored PVC from snapshot
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: truenas-csi-snapshot-restored
  namespace: csi-test
spec:
  storageClassName: truenas-csi-nfs
  dataSource:
    name: truenas-csi-test-snapshot
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
# Pod to verify restored data
apiVersion: v1
kind: Pod
metadata:
  name: csi-test-snapshot-reader
  namespace: csi-test
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: truenas-csi-snapshot-restored
  restartPolicy: Never
