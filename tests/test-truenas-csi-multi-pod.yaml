---
# Multi-pod test: 3 pods on different nodes sharing same PVC (ReadWriteMany)
apiVersion: v1
kind: Namespace
metadata:
  name: csi-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: truenas-csi-shared-pvc
  namespace: csi-test
spec:
  storageClassName: truenas-csi-nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: csi-test-pod-1
  namespace: csi-test
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: truenas-csi-shared-pvc
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: csi-test-pod-2
  namespace: csi-test
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: truenas-csi-shared-pvc
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: csi-test-pod-3
  namespace: csi-test
spec:
  containers:
    - name: test
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: truenas-csi-shared-pvc
  restartPolicy: Never
